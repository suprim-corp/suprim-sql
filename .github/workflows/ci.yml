name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  check:
    runs-on: [self-hosted, linux, rust]
    # Block forked PRs from running on self-hosted runner (security).
    # push events have no pull_request context → always run.
    # PR events: only run if PR is from the same repo (not a fork).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - name: Checkout extensions submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.EXTENSIONS_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-check-

      - name: Build
        run: cargo build --features dev-test

      - name: Test
        run: cargo test -p suprim-core --lib

      - name: Clippy
        run: cargo clippy -p suprim-core -p suprim-app --features dev-test -- -D warnings
