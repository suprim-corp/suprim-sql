name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout extensions submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.EXTENSIONS_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --features dev-test

      - name: Test
        run: cargo test -p suprim-core --lib

      - name: Clippy
        run: cargo clippy --features dev-test -- -D warnings
