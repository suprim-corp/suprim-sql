name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'extensions/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, linux, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout extensions submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.EXTENSIONS_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --features dev-test

      - name: Test
        run: cargo test -p suprim-core --lib

      - name: Clippy
        run: cargo clippy -p suprim-core -p suprim-app --features dev-test -- -D warnings
